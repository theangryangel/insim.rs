[package]
name = "insim"
description = "LiveForSpeed Insim implementation that focuses on ergonomics and strong typing"
version = "4.1.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true

[lib]
bench = false

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docrs"]

[features]
default = ["tokio", "blocking"]
allow-unknown-packet = []
blocking = ["insim_core/blocking", "outgauge/blocking", "outsim/blocking"]
tokio = [
  "dep:tokio",
  "insim_core/tokio",
  "outgauge/tokio",
  "outsim/tokio",
]
serde = [
  "dep:serde",
  "insim_core/serde",
  "indexmap/serde",
  "bytes/serde",
  "outgauge/serde",
  "outsim/serde",
]
glam = [
  "insim_core/glam"
]

[dependencies]
outgauge = { path = "../outgauge", version = "0.1.0" }
outsim = { path = "../outsim", version = "0.1.1" }
bitflags = { workspace = true }
bytes = { workspace = true }
from_variants = { workspace = true }
indexmap = { workspace = true }
insim_core = { path = "../insim_core", version = "3.0.0" }
serde = { workspace = true, features = ["derive"], optional = true }
digest = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "time", "net", "macros", "sync", "tracing", "io-util"], optional = true }
tracing = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
