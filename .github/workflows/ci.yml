name: ci
on:
  pull_request:
    branches:
      - main

env:
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: j178/prek-action@v3.1.0

  check_codepage_lut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check generated codepage LUT (lookup table) is up to date
        run: |
          cargo run -p xtask-codepage-lut
          git diff --exit-code -- insim_core/src/string/codepages_lut.rs

  test:
    runs-on: ubuntu-latest
    needs: [prek, check_codepage_lut]
    strategy:
      matrix:
        channel: [stable, nightly]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.channel }}
      - uses: Swatinem/rust-cache@v2
      - name: Run cargo test (all-features)
        run: cargo test --all --all-targets --all-features
      - name: Run cargo test (default features)
        run: cargo test --all --all-targets

  docs:
    runs-on: ubuntu-latest
    needs: [prek]
    strategy:
      matrix:
        channel: [stable, nightly]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.channel }}
      - uses: Swatinem/rust-cache@v2
      - name: Run cargo doc
        run: cargo doc --no-deps

  msrv:
    runs-on: ubuntu-latest
    needs: [prek, check_codepage_lut]
    steps:
      - uses: actions/checkout@v7
      - name: Get MSRV from package metadata
        id: msrv
        run: grep rust-version Cargo.toml | cut -d'"' -f2 | sed 's/^/version=/' >> $GITHUB_OUTPUT
      - name: Install rust (${{ steps.msrv.outputs.version }})
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - name: Run cargo check
        run: cargo check --all-targets --all-features
