[package]
name = "insim_extra"
description = "Standalone Insim components"
version = "0.2.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
publish = false  # XXX: remove when we're comfortable releasing

[lints]
workspace = true

[dependencies]
insim = { path = "../insim", features = ["tokio"] }
insim_extra_macros = { path = "../insim_extra_macros" }
tokio = { workspace = true, features = ["time", "sync", "rt", "macros"] }
futures = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
fixedbitset = { workspace = true }
taffy = "0.15"
fastrand = "2"
multi_index_map = "0.16"

[dev-dependencies]
insim = { path = "../insim", features = ["test-util"] }
tokio = { workspace = true, features = ["time", "sync", "rt", "macros", "net", "test-util"] }
